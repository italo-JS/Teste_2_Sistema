<!-- ══════════════════════════════════════
     MODAL: RELATÓRIO EPI / FARDAMENTO
     Responsabilidade: exibir um relatório formatado de EPIs
     e fardamentos com resumo estatístico e listagem completa,
     com opção de exportar para PDF via impressão do navegador.
     Ativação: epiGerarRelatorio() → preenche e exibe este modal
     Fechamento: epiFecharRelatorio() → oculta este modal
     Funções JS relacionadas (modules/epi.js):
       - epiGerarRelatorio()      → monta o conteúdo do relatório
       - epiFecharRelatorio()     → fecha o modal
       - epiImprimirRelatorio()   → aciona window.print() para PDF
     ══════════════════════════════════════ -->
<div class="modal-overlay" id="epi-modal-relatorio"
     onclick="if(event.target===this)epiFecharRelatorio()">
  <div class="modal" style="width:700px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column">

    <!-- Cabeçalho do modal -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div class="modal-title">📋 Relatório EPI / Fardamento</div>
        <!-- Subtítulo preenchido dinamicamente por epiGerarRelatorio() -->
        <div class="modal-sub" style="margin-bottom:0" id="epi-rel-sub">—</div>
      </div>
      <button onclick="epiFecharRelatorio()"
              style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px">✕</button>
    </div>

    <!-- Grade de resumo estatístico (4 colunas)
         Preenchido dinamicamente por epiGerarRelatorio():
         total de itens, valor total, itens vencendo, perdidos/quebrados -->
    <div id="epi-rel-resumo"
         style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px">
    </div>

    <!-- Corpo do relatório: listagem detalhada dos itens
         Preenchido dinamicamente por epiGerarRelatorio() -->
    <div id="epi-rel-corpo" style="overflow-y:auto;flex:1"></div>

    <!-- Rodapé com ações -->
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn btn-ghost" onclick="epiFecharRelatorio()">Fechar</button>
      <!-- epiImprimirRelatorio() → aciona window.print() para exportar PDF -->
      <button class="btn btn-primary" onclick="epiImprimirRelatorio()">↓ Exportar PDF</button>
    </div>

  </div>
</div>
