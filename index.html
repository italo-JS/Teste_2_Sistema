<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatriX — Gestão Patrimonial</title>

  <!-- Fontes -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
</head>

<body>

  <!-- ══ Loading overlay ══ -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Carregando dados...</div>
  </div>

  <!-- ══ App Shell ══
       O loader.js injeta: sidebar, topbar, pages e modals aqui. -->
  <div class="app" id="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main" id="main-content">
      <div id="topbar-placeholder"></div>
      <div id="pages-container"></div>
    </div>
  </div>

  <!-- ══ Toast global ══ -->
  <div class="toast" id="toast">
    <div class="toast-dot" id="toast-dot"></div>
    <span id="toast-msg"></span>
  </div>

  <!-- ══ Área de impressão ══ -->
  <div id="print-area"></div>

  <!-- ══ Auth / Sessão (MODO LOCAL) ══
       Neste estágio de transição, a autenticação obrigatória foi removida.
       O sistema opera em modo local/híbrido até a implementação do novo backend. -->
  <script>
    console.log('🚀 PatriX iniciado em modo de transição (Local/Mock)');

    // Mock do cliente Supabase para evitar erros de referência no config.js
    window._sb = {
      auth: { getSession: () => Promise.resolve({ data: { session: null } }), signOut: () => { } },
      from: () => ({ select: () => ({ order: () => Promise.resolve({ data: [], error: null }) }) })
    };

    // Logout limpa apenas o estado local
    function logout() {
      localStorage.clear();
      window.location.reload();
    }
  </script>

  <!-- ══ Component Loader ══
       Carrega todos os componentes HTML (sidebar, topbar, pages, modals)
       e, após injetá-los no DOM, inicializa o app.js. -->
  <script src="js/loader.js"></script>

</body>

</html>
