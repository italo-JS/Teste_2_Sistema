<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatriX — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;  400;500;600&family=DM+Mono:wght@400;500&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d0f12;--bg2:#13161b;--bg3:#1a1e25;--bg4:#212630;
      --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
      --accent:#00d4aa;--accent2:#00a882;--accent-dim:rgba(0,212,170,.12);
      --red:#ff5c5c;--red-dim:rgba(255,92,92,.12);
      --text:#e8eaed;--text2:#8b9099;--text3:#555b65;
      --r:10px;--rl:16px;
    }
    /* Estilos globais compartilhados */
    @import url('style.css');
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    body::after{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(0,212,170,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
    .login-card{position:relative;z-index:1;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 36px;width:100%;max-width:420px;animation:fadeUp .3s ease}
    .login-header{text-align:center;margin-bottom:32px}
    .login-logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px}
    .login-logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .login-logo-icon svg{width:20px;height:20px}
    .login-logo-name{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;color:#fff;text-shadow:1px 1px 0px #ccc,2px 2px 0px #999,3px 3px 5px rgba(0,0,0,.5);letter-spacing:.01em}
    .login-logo-name span{color:#FF0000;text-shadow:0 0 10px rgba(255,0,0,.6),1px 1px 0px #800000}
    .login-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
    .login-sub{font-size:12px;color:var(--text3)}
    .login-divider{height:1px;background:var(--border);margin-bottom:28px}
    .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .fg label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
    .fg .input-wrap{position:relative}
    .fg .input-wrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none;transition:color .15s}
    .fg input{width:100%;padding:10px 12px 10px 38px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .15s,background .15s}
    .fg input:focus{border-color:var(--accent);background:var(--bg4)}
    .fg .input-wrap:focus-within>svg{color:var(--accent)}
    .fg input::placeholder{color:var(--text3)}
    .toggle-senha{position:absolute;right:30px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:2px;display:flex;align-items:center;transition:color .15s}
    .toggle-senha:hover{color:var(--text2)}
    .toggle-senha svg{width:15px;height:15px}
    .login-forgot{text-align:right;margin-top:-8px;margin-bottom:20px}
    .login-forgot a{font-size:11px;color:var(--text3);text-decoration:none;transition:color .15s}
    .login-forgot a:hover{color:var(--accent)}
    .btn-login{width:100%;padding:11px;background:var(--accent);color:#000;border:none;border-radius:var(--r);font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s,transform .15s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover{background:var(--accent2);transform:translateY(-1px)}
    .btn-login:active{transform:translateY(0)}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-login svg{width:15px;height:15px}
    .btn-spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .login-error{display:none;background:var(--red-dim);border:1px solid rgba(255,92,92,.2);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:16px;align-items:center;gap:8px}
    .login-error svg{width:14px;height:14px;flex-shrink:0}
    .login-success{display:none;background:var(--accent-dim);border:1px solid rgba(0,212,170,.2);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:16px;align-items:center;gap:8px}
    .login-success svg{width:14px;height:14px;flex-shrink:0}
    .login-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);text-align:center;font-size:10px;color:var(--text3)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
            <path d="M3 3h18v4H3zM3 10h12v4H3zM3 17h8v4H3z"/>
          </svg>
        </div>
        <div class="login-logo-name">Patri<span>X</span></div>
      </div>
      <div class="login-title">Acesso ao sistema</div>
      <div class="login-sub">Gestão Patrimonial — v2.4</div>
    </div>

    <div class="login-divider"></div>

    <div class="login-error" id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="login-error-msg">E-mail ou senha incorretos.</span>
    </div>

    <div class="login-success" id="login-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>Login realizado! Redirecionando...</span>
    </div>

    <div class="fg">
      <label>E-mail</label>
      <div class="input-wrap">
        <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
    </div>

    <div class="fg">
      <label>Senha</label>
      <div class="input-wrap">
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <button class="toggle-senha" type="button" id="toggle-senha">
          <svg id="icon-olho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="login-forgot"><a href="#">Esqueceu a senha?</a></div>

    <button class="btn-login" id="btn-login" type="button">
      <div class="btn-spinner" id="btn-spinner"></div>
      <svg id="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
      </svg>
      <span id="btn-texto">Entrar</span>
    </button>

    <div class="login-footer">
      © 2025 PatriX &nbsp;·&nbsp; Acesso restrito a usuários autorizados
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Supabase ──
    const SUPABASE_URL = 'https://nlrfgtfzszqnjzidkjvl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5scmZndGZ6c3pxbmp6aWRranZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODA2NTYsImV4cCI6MjA5MTY1NjY1Nn0.LtNyrnskJSfRreQO_3KMZw4GoO00aoROTxl-_Pvc_h4';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Se já estiver logado, redireciona direto
    // Se já estiver logado, redireciona direto para o app (mesmo diretório)
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'index.html';
    });

    // Toggle olho
    document.getElementById('toggle-senha').addEventListener('click', function () {
      const input = document.getElementById('login-senha');
      const icon  = document.getElementById('icon-olho');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      }
    });

    // Enter para submeter
    ['login-email','login-senha'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
      });
    });

    // Helpers UI
    function mostrarErro(msg) {
      const el = document.getElementById('login-error');
      document.getElementById('login-error-msg').textContent = msg;
      el.style.display = 'flex';
      document.getElementById('login-success').style.display = 'none';
    }

    function mostrarSucesso() {
      document.getElementById('login-success').style.display = 'flex';
      document.getElementById('login-error').style.display = 'none';
    }

    function setBotaoCarregando(ativo) {
      const btn = document.getElementById('btn-login');
      btn.disabled = ativo;
      document.getElementById('btn-spinner').style.display = ativo ? 'block' : 'none';
      document.getElementById('btn-icon').style.display    = ativo ? 'none'  : 'block';
      document.getElementById('btn-texto').textContent     = ativo ? 'Entrando...' : 'Entrar';
    }

    // ── LOGIN ──
    document.getElementById('btn-login').addEventListener('click', async function () {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      if (!email || !senha) {
        mostrarErro('Preencha o e-mail e a senha.');
        return;
      }

      setBotaoCarregando(true);

      try {
        // 1. Autenticar
        const { data: authData, error: authError } = await sb.auth.signInWithPassword({
          email,
          password: senha
        });

        if (authError) {
          if (authError.message.includes('Invalid login')) {
            mostrarErro('E-mail ou senha incorretos.');
          } else if (authError.message.includes('Email not confirmed')) {
            mostrarErro('E-mail ainda não confirmado. Verifique sua caixa de entrada.');
          } else {
            mostrarErro('Erro ao fazer login. Tente novamente.');
          }
          setBotaoCarregando(false);
          return;
        }

        // 2. Buscar cargo na tabela perfis_usuarios
        // Cargos possíveis: 'administrador' | 'supervisor' | 'funcionario'
        // Esta tabela será criada no Passo 4 — por enquanto o login já funciona mesmo sem ela
        const { data: perfil } = await sb
          .from('perfis_usuarios')
          .select('cargo')
          .eq('user_id', authData.user.id)
          .single();

        // 3. Salvar cargo no localStorage para o sistema usar
        localStorage.setItem('patrix_cargo', perfil?.cargo ?? 'funcionario');
        localStorage.setItem('patrix_email', authData.user.email);
        localStorage.setItem('patrix_login_time', Date.now().toString());

        // 4. Sucesso — redirecionar para o app (index.html está no mesmo diretório)
        mostrarSucesso();
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);

      } catch (err) {
        mostrarErro('Erro inesperado. Tente novamente.');
        setBotaoCarregando(false);
      }
    });
  </script>

</body>
</html>
